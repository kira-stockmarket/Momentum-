name: Walk-Forward Momentum ML Pipeline

on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  train-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgomp1

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Phase 1 - Download Data and Build Features
      run: python 1_download_data.py

    - name: Phase 2 - Run ML Training (1 Hour) & SHAP Analysis
      run: python 2_train_model.py

    - name: Commit & Push Model and Reports
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        # We explicitly only add models and reports to avoid committing massive data files
        git add models/ reports/
        git commit -m "chore: auto-update momentum model and SHAP analysis" -a || echo "No changes to commit"
        git push
